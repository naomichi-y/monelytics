# HTTP。ACME のチャレンジだけ応答し、それ以外は HTTPS へ送る。
server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;

    # ACME (Let's Encrypt) の HTTP-01 チャレンジ用。更新時もここが使われるため
    # リダイレクトの対象から外す。^~ で下の正規表現 location より優先させる。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 証明書は monelytics.me にしか有効でないため、IP 直打ちで来た場合も
    # $host ではなくドメインへ固定して送る。
    location / {
        return 301 https://monelytics.me$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monelytics.me;

    # 旧 nginx.conf から移植。既定値では gzip 無効・バージョン露出となるため。
    server_tokens off;

    # 証明書の発行と更新はホストの certbot が行う。/etc/letsencrypt は
    # コンテナへ読み取り専用でマウントしている (compose.yml 参照)。
    ssl_certificate     /etc/letsencrypt/live/monelytics.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monelytics.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Let's Encrypt は OCSP の提供を終了しており証明書に OCSP URI がない。
    # そのため ssl_stapling は設定しない。

    # HSTS。一度送るとブラウザが max-age の間 HTTP を拒否し取り消せないため、
    # HTTPS での動作を確認してから有効化すること。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css
               text/javascript
               application/javascript
               application/json
               image/svg+xml;

    root /data/public;
    charset UTF-8;
    index index.php index.html;

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php(/|$) {
        # unix ソケットから TCP へ変更した。php サービスの 9000 番へ転送する。
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(.+)$;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
        # これがないと Laravel が HTTP とみなし、生成する URL が http:// になる。
        fastcgi_param HTTPS on;
    }
}
