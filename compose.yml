# arm64 (Ampere A1) 上での稼働構成。
# 旧構成 (compose v2 記法) はベースイメージが全て amd64 専用だったため置き換えた。
# volumes_from が廃止されたため、ソースの共有は data コンテナからバインドマウントに変更している。
# composer / artisan / phpunit は専用サービスを持たず、php コンテナへの exec で実行する (README 参照)。

# php と php-e2e のビルド定義。1 つに束ねて共有する。
#
# webapp の uid/gid がずれると、同じチェックアウトを見ている 2 つが互いに
# 書けないファイルを置き合う。README の build は既定のプロファイルしか焼かず、
# e2e プロファイルの php-e2e には --build-arg が渡らないため、こちらだけ
# 既定の 1000 になっていた。E2E が Blade をコンパイルすると本番の php-fpm
# (1001) がそれを touch できず、月別集計と年別集計が 500 になった。
x-php-build: &php-build
  context: ./etc/docker/php
  args:
    # チェックアウトの所有者に合わせる。値は .env に置く (.env.example 参照)。
    UID: ${WEBAPP_UID:-1000}
    GID: ${WEBAPP_GID:-1000}

services:
  web:
    image: nginx:1.31-alpine
    container_name: monelytics_web
    depends_on:
      - php
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx が配信するのは公開ディレクトリのみ。アプリ全体はマウントしない。
      - ./public:/data/public:ro
      - ./etc/docker/web/default.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS 証明書。発行と更新はホストの certbot が行い、nginx は読むだけ。
      # live/ 配下は archive/ への symlink なので /etc/letsencrypt ごと渡す。
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME の HTTP-01 チャレンジ応答ファイル置き場。
      - /var/www/certbot:/var/www/certbot:ro
    restart: unless-stopped

  php:
    # uid/gid はホストに合わせる必要がある。ビルド手順は README を参照。
    build: *php-build
    container_name: monelytics_php
    depends_on:
      - db
      - redis
    volumes:
      - ./:/data
    restart: unless-stopped

  db:
    # mysql:5.7 に arm64 版が存在しないため、互換性の高い MariaDB へ置き換えた。
    # 本番データを持つため、最新の 13 系ではなく LTS 系列を使う。
    image: mariadb:12.3
    container_name: monelytics_db
    # Laravel の .env が直下にあり compose の既定変数ファイルと衝突するため、
    # DB の認証情報は専用ファイルに分離する。
    env_file:
      - ./etc/docker/db/db.env
    volumes:
      - dbdata:/var/lib/mysql
      - ./etc/docker/db/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./etc/docker/db/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    # 元の redis.conf は 3.2 向けで slave-* 系の記述が残るため、既定設定で起動する。
    image: redis:8-alpine
    container_name: monelytics_redis
    # SESSION_DRIVER=redis のため、コンテナ再作成でログアウトしないよう永続化する。
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # E2E 用のアプリ一式。本番へ触れないよう、書き込む先を全て別に向ける
  # (スキーマ、Redis の DB 番号、コンパイル済みの Blade、ログ)。同じ
  # チェックアウトを共有するため、向け忘れたものはそのまま本番と奪い合う。
  # Laravel の Dotenv は既存の環境変数を上書きしないため、ここでの
  # environment が .env より優先される。
  # 起動は profile 指定で行う: docker compose --profile e2e up -d
  php-e2e:
    build: *php-build
    container_name: monelytics_php_e2e
    profiles: ["e2e"]
    depends_on:
      - db
      - redis
    volumes:
      - ./:/data
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost:8081
      DB_DATABASE: monelytics_e2e
      REDIS_DB: "2"
      REDIS_CACHE_DB: "3"
      MAIL_MAILER: array
      # .env は本番向けに SESSION_SECURE_COOKIE=true を持つが、ここは平文の
      # http で配信するため、そのままでは Cookie が返らず全ての POST が 419 になる。
      SESSION_SECURE_COOKIE: "false"
      # ログは本番のファイルへ混ぜず、コンテナの標準エラーへ出す
      # (docker compose logs php-e2e で読む)。同じチェックアウトを見るため
      # 既定では storage/logs/laravel.log を奪い合い、本番が落ちたときに
      # 見に行く場所が E2E の記録で埋まる。
      LOG_CHANNEL: stderr
      # コンパイル済みの Blade は本番と分ける。同じチェックアウトを見るため
      # 既定では置き場所まで同じになり、片方が view:clear を掛けると相手の
      # 分も消える。APP_ENV の違う 2 つが同じ置き場所を奪い合う形になる。
      VIEW_COMPILED_PATH: /data/storage/framework/views-e2e
      # 同一 IP から繰り返しログインするため、本番の値では 429 になる。
      RATE_LIMIT_LOGIN: "1000,1"
      RATE_LIMIT_REGISTRATION: "1000,1"
      RATE_LIMIT_CONTACT: "1000,1"
    restart: unless-stopped

  web-e2e:
    image: nginx:1.31-alpine
    container_name: monelytics_web_e2e
    profiles: ["e2e"]
    depends_on:
      - php-e2e
    ports:
      - "8081:80"
    volumes:
      - ./public:/data/public:ro
      - ./etc/docker/web/e2e.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # ブラウザ同梱の公式イメージ。ホストに node を入れずに実行する。
  playwright:
    image: mcr.microsoft.com/playwright:v1.56.0-noble
    container_name: monelytics_playwright
    profiles: ["e2e"]
    depends_on:
      - web-e2e
    working_dir: /data
    volumes:
      - ./:/data
    environment:
      E2E_BASE_URL: http://web-e2e
      CI: "1"
    # 実行するまで待機させる。
    entrypoint: ["sleep", "infinity"]

volumes:
  dbdata:
  redisdata:
