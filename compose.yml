# arm64 (Ampere A1) 上での稼働構成。
# 旧構成 (compose v2 記法) はベースイメージが全て amd64 専用だったため置き換えた。
# volumes_from が廃止されたため、ソースの共有は data コンテナからバインドマウントに変更している。
# composer / artisan / phpunit は専用サービスを持たず、php コンテナへの exec で実行する (README 参照)。

services:
  web:
    image: nginx:1.31-alpine
    container_name: monelytics_web
    depends_on:
      - php
    ports:
      - "80:80"
    volumes:
      # nginx が配信するのは公開ディレクトリのみ。アプリ全体はマウントしない。
      - ./public:/data/public:ro
      - ./etc/docker/web/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  php:
    # uid/gid はホストに合わせる必要がある。ビルド手順は README を参照。
    build: ./etc/docker/php
    container_name: monelytics_php
    depends_on:
      - db
      - redis
    volumes:
      - ./:/data
    restart: unless-stopped

  db:
    # mysql:5.7 に arm64 版が存在しないため、互換性の高い MariaDB へ置き換えた。
    # 本番データを持つため、最新の 13 系ではなく LTS 系列を使う。
    image: mariadb:12.3
    container_name: monelytics_db
    # Laravel の .env が直下にあり compose の既定変数ファイルと衝突するため、
    # DB の認証情報は専用ファイルに分離する。
    env_file:
      - ./etc/docker/db/db.env
    volumes:
      - dbdata:/var/lib/mysql
      - ./etc/docker/db/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./etc/docker/db/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    # 元の redis.conf は 3.2 向けで slave-* 系の記述が残るため、既定設定で起動する。
    image: redis:8-alpine
    container_name: monelytics_redis
    # SESSION_DRIVER=redis のため、コンテナ再作成でログアウトしないよう永続化する。
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  dbdata:
  redisdata:
